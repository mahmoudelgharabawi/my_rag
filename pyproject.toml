[project]
name = "my-rag"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "mahmoudelgharabawi", email = "m.elgharabawi3@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "langchain-chroma>=1.2.0",
    "langchain-community>=0.4.2",
    "langchain-huggingface>=1.3.0",
    "langchain-text-splitters>=1.2.0",
    "python-dotenv>=1.2.4",
    "sentence-transformers>=6.3.0",
    "torch>=2.15.0",
    "transformers>=5.24.0",
]

[project.scripts]
my-rag = "my_rag:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"
